name: Build and deploy

# Every push to main rebuilds the site from src/page.html and publishes it.
# Editing src/page.html and pushing is the whole workflow — no local build needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than deploying two versions at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build from source
        run: node build.js

      - name: Warn if committed output is stale
        # The deploy always uses the freshly built files, so drift can't break the
        # live site — but a stale committed index.html would mislead anyone who
        # opens it locally or drag-drops the folder to Netlify.
        run: |
          if ! git diff --quiet -- index.html dist/artifact.html assets/; then
            echo "::warning::Committed build output differs from a fresh build of src/page.html. Run 'node build.js' and commit the result."
            git diff --stat -- index.html dist/artifact.html assets/
          else
            echo "Committed output matches a fresh build."
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp Tushar_Wararkar_Resume.pdf _site/
          cp -r assets _site/assets
          touch _site/.nojekyll
          echo "--- _site contents ---"
          find _site -type f | sort

      - name: Verify the build produced a real page
        run: |
          test -s _site/index.html
          grep -q "Tushar Wararkar" _site/index.html
          test -s _site/assets/portrait.jpg
          test -s _site/Tushar_Wararkar_Resume.pdf
          echo "index.html $(wc -c < _site/index.html) bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
